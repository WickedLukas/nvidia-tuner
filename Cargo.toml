[package]
name = "nvidia-tuner"
version = "0.7.2-gfd"
edition = "2021"
license = "MIT"
description = "Linux 下的 NVIDIA 显卡命令行调校工具：超频、降压、限功耗，并以热量意图律驱动风扇——利用率=意图、温度=状态、导数=势能，逐拍决策保温度不急剧变化；NVML 实现，X11/Wayland 通吃；保留上游曲线模式，--fan-mode 一键切换。"
repository = "https://github.com/WickedLukas/nvidia-tuner.git"
homepage = "https://github.com/liulisky/nvidia-tuner"

[dependencies]
sudo2 = "0.2.1"
which = "8.0.6"
clap = { version = "4.6.7", features = ["derive"] }
nvml-wrapper = "0.13.0"
nvml-wrapper-sys = "0.10.0"
signal-hook = "0.4.5"

[profile.release]
lto = true
