name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            bin: nvidia-tuner-linux-x86_64
            note: dynamic, glibc>=2.39
          - target: x86_64-unknown-linux-musl
            bin: nvidia-tuner-linux-x86_64-static
            note: fully static
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --target x86_64-unknown-linux-gnu   # 门禁：决策表单测全绿才发布
      - run: cargo build --release --target ${{ matrix.target }}
      - run: |
          cp target/${{ matrix.target }}/release/nvidia-tuner ${{ matrix.bin }}
          sha256sum ${{ matrix.bin }} > ${{ matrix.bin }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          path: |
            ${{ matrix.bin }}
            ${{ matrix.bin }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: |
          mkdir -p rel
          for d in artifacts/*/; do b=$(basename "$d"); mv "$d/nvidia-tuner" "rel/$b"; mv "$d/nvidia-tuner.sha256" "rel/$b.sha256"; done
          ls -la rel/
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: rel/*
