name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test                      # 门禁：决策表单测全绿才发布
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: |
          cp target/x86_64-unknown-linux-musl/release/nvidia-tuner nvidia-tuner-linux-x86_64-static
          sha256sum nvidia-tuner-linux-x86_64-static > nvidia-tuner-linux-x86_64-static.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            nvidia-tuner-linux-x86_64-static
            nvidia-tuner-linux-x86_64-static.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*
